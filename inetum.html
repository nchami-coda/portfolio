<style>
:root{--bg:#0d0521;--card:#1c1038;--purple:#c084fc;--purple2:#a855f7;--purple3:#7c3aed;--txt:#e9e4f5;--muted:#a99fc4;--border:rgba(192,132,252,.18);--threat:#fb7185;--ok:#4ade80;--mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(ellipse 70% 55% at 50% 0%,#1f0e45 0%,var(--bg) 70%);color:var(--txt);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column}
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 5%;border-bottom:1px solid var(--border);background:rgba(13,5,33,.75)}
.logo{font-size:1.35rem;font-weight:800;text-decoration:none;background:linear-gradient(90deg,var(--purple),var(--purple3));-webkit-background-clip:text;background-clip:text;color:transparent}
.back{color:var(--muted);text-decoration:none;font-size:.95rem}
.back:hover{color:var(--purple)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.lock{width:min(440px,100%);background:var(--card);border:1px solid var(--border);border-radius:22px;padding:34px 30px 28px;box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 0 1px rgba(168,85,247,.06);text-align:center}
.ico{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;font-size:1.8rem;background:rgba(168,85,247,.12);border:1px solid var(--border)}
h1{font-size:1.6rem;font-weight:800;background:linear-gradient(90deg,var(--purple),#e9d5ff,var(--purple3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:.9rem;line-height:1.6;margin:10px 0 24px}
form{display:flex;flex-direction:column;gap:12px}
.field{position:relative}
input{width:100%;background:#0a0319;border:1px solid var(--border);border-radius:14px;color:var(--txt);font:inherit;font-size:1rem;padding:14px 52px 14px 16px;transition:border-color .2s}
input:focus{outline:none;border-color:var(--purple2);box-shadow:0 0 0 3px rgba(168,85,247,.18)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.05rem;padding:8px;border-radius:10px}
.eye:hover{color:var(--purple)}
button.go{border:none;border-radius:50px;padding:13px 20px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--purple2),var(--purple3));box-shadow:0 8px 25px rgba(168,85,247,.35);transition:transform .2s,opacity .2s}
button.go:hover{transform:translateY(-2px)}
button.go:disabled{opacity:.6;cursor:wait;transform:none}
.msg{min-height:1.3em;font-size:.86rem;color:var(--muted)}
.msg.err{color:var(--threat)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.meta{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);font-family:var(--mono);font-size:.72rem;color:var(--muted);line-height:1.7}
.meta b{color:var(--ok);font-weight:600}
noscript p{margin-top:14px;color:var(--threat);font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
